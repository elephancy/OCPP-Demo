name: ci-deploy

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - name: Install simulator dependencies
        working-directory: simulator
        run: pip install -r requirements-dev.txt
      - name: Run simulator tests
        working-directory: simulator
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend smoke
        working-directory: frontend
        run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare env
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          files: docker-compose.yml
          targets: backend,worker,frontend,simulator
          load: true
          set: |
            backend.cache-from=type=gha,scope=ocpp-backend
            backend.cache-to=type=gha,mode=max,scope=ocpp-backend
            backend.tags=ocpp-backend-demo-backend:latest
            worker.cache-from=type=gha,scope=ocpp-worker
            worker.cache-to=type=gha,mode=max,scope=ocpp-worker
            worker.tags=ocpp-backend-demo-worker:latest
            frontend.cache-from=type=gha,scope=ocpp-frontend
            frontend.cache-to=type=gha,mode=max,scope=ocpp-frontend
            frontend.tags=ocpp-backend-demo-frontend:latest
            simulator.cache-from=type=gha,scope=ocpp-simulator
            simulator.cache-to=type=gha,mode=max,scope=ocpp-simulator
            simulator.tags=ocpp-backend-demo-simulator:latest
      - name: Start Compose stack
        run: docker compose up -d --no-build
      - name: Run Compose smoke
        run: bash ./scripts/compose-smoke.sh
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

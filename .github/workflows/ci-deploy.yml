name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  backend-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt -r requirements-audit.txt coverage==7.16.2
      - name: Audit backend runtime and test dependencies
        run: |
          python -m pip list --format=freeze > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Run backend tests
        working-directory: backend
        run: |
          python -m coverage run --branch --source=app -m pytest
          python -m coverage xml -o coverage.xml
      - name: Preserve ocpp-backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-ocpp-backend
          path: backend/coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Upload ocpp-backend coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./backend/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - name: Install simulator dependencies
        working-directory: simulator
        run: pip install -r requirements-dev.txt -r requirements-audit.txt
      - name: Audit simulator runtime and test dependencies
        run: |
          python -m pip list --format=freeze > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Run simulator tests
        working-directory: simulator
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend runtime and development dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend smoke
        working-directory: frontend
        run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare env
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: backend,worker,frontend,simulator
          load: true
          set: |
            backend.cache-from=type=gha,scope=ocpp-backend
            backend.cache-to=type=gha,mode=max,scope=ocpp-backend
            backend.tags=ocpp-backend-demo-backend:latest
            worker.cache-from=type=gha,scope=ocpp-worker
            worker.cache-to=type=gha,mode=max,scope=ocpp-worker
            worker.tags=ocpp-backend-demo-worker:latest
            frontend.cache-from=type=gha,scope=ocpp-frontend
            frontend.cache-to=type=gha,mode=max,scope=ocpp-frontend
            frontend.tags=ocpp-backend-demo-frontend:latest
            simulator.cache-from=type=gha,scope=ocpp-simulator
            simulator.cache-to=type=gha,mode=max,scope=ocpp-simulator
            simulator.tags=ocpp-backend-demo-simulator:latest
      - name: Start Compose stack
        run: docker compose up -d --no-build
      - name: Run Compose smoke
        run: bash ./scripts/compose-smoke.sh
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
